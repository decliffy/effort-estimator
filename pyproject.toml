[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effort-estimator"
version = "0.1.0"
description = "A CLI tool that estimates task effort using t-shirt sizes via the Anthropic Claude API"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
estimate = "estimator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
